alias +pksprint "pk_sprint_on"
alias -pksprint "pk_sprint_off"
alias +pkslide  "pk_slide_on"
alias -pkslide  "pk_slide_off"
alias +pkw "+forward; pk_fwd_on"
alias -pkw "-forward; pk_fwd_off"
alias +pka "+moveleft; pk_left_on"
alias -pka "-moveleft; pk_left_off"
alias +pks "+back; pk_back_on"
alias -pks "-back; pk_back_off"
alias +pkd "+moveright; pk_right_on"
alias -pkd "-moveright; pk_right_off"
bind w +pkw
bind a +pka
bind s +pks
bind d +pkd
bind shift +pksprint
bind ctrl  +pkslide
bind f     pk_toggle
